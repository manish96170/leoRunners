apiVersion: extensions.leorunners.io/v1
kind: ExtensionRuntimePolicy
metadata:
  name: default-runtime-policy
  version: 1.0.0
spec:
  global:
    enabled: true
    tenant_allowlist:
      - tenant-demo
      - tenant-platform
  consumers:
    - id: analytics
      enabled: true
      tenant_allowlist:
        - tenant-demo
        - tenant-platform
      queue:
        max_items: 256
        overflow: drop
      timeout_ms: 250
      capabilities:
        - read_events
        - emit_advisories
      redaction:
        required: true
        mode: metadata-only
        max_bytes: 16384
    - id: cache
      enabled: true
      tenant_allowlist:
        - tenant-demo
      queue:
        max_items: 128
        overflow: drop
      timeout_ms: 250
      capabilities:
        - read_events
        - emit_advisories
      redaction:
        required: true
        mode: metadata-only
        max_bytes: 16384
    - id: cost
      enabled: true
      tenant_allowlist:
        - tenant-platform
      queue:
        max_items: 128
        overflow: drop
      timeout_ms: 500
      capabilities:
        - read_events
        - emit_advisories
      redaction:
        required: true
        mode: metadata-only
        max_bytes: 16384
    - id: security
      enabled: true
      tenant_allowlist:
        - tenant-demo
        - tenant-platform
      queue:
        max_items: 256
        overflow: drop
      timeout_ms: 250
      capabilities:
        - read_events
        - emit_advisories
      redaction:
        required: true
        mode: metadata-only
        max_bytes: 16384
