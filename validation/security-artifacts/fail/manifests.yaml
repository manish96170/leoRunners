apiVersion: v1
kind: Secret
metadata:
  name: unsafe
stringData:
  token: super-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: unsafe
spec:
  hostNetwork: true
  containers:
    - name: unsafe
      image: example.invalid/runner:latest
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
      env:
        - name: AI_ENABLED
          value: "true"
        - name: AI_API_KEY
          value: sk-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unsafe
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
