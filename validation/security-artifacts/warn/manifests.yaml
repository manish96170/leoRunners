apiVersion: apps/v1
kind: Deployment
metadata:
  name: warn-runner
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: runner
          image: example.invalid/runner@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
