apiVersion: observability.leorunners.io/v1
kind: AlertConfig
metadata:
  name: default
  version: 1.0.0
spec:
  enabled: true
  namespace: LeoRunners/Controller
  dimensions: [provider, region, state, outcome, capacity_owner, error_class]
  alerts:
    - name: lifecycle-failure-rate
      enabled: true
      metric: lifecycle_events_total
      statistic: Sum
      comparison: GreaterThanOrEqualToThreshold
      threshold: 5
      period_seconds: 60
      evaluation_periods: 5
      severity: critical
      dimensions: [provider, outcome]
      actions: [notify_oncall]
    - name: active-runner-capacity
      enabled: true
      metric: active_runners
      statistic: Maximum
      comparison: GreaterThanThreshold
      threshold: 500
      period_seconds: 60
      evaluation_periods: 3
      severity: warning
      dimensions: [provider, region, capacity_owner]
      actions: [notify_team]
