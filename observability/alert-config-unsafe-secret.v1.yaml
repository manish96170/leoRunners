apiVersion: observability.leorunners.io/v1
kind: AlertConfig
metadata:
  name: unsafe
  version: 1.0.0
spec:
  enabled: true
  namespace: LeoRunners/Controller
  dimensions: [provider]
  alerts:
    - name: leaked-token
      enabled: true
      metric: lifecycle_events_total
      statistic: Sum
      comparison: GreaterThanThreshold
      threshold: 1
      period_seconds: 60
      evaluation_periods: 1
      severity: critical
      dimensions: [provider]
      actions: [notify_oncall]
      token: ghp_012345678901234567890123456789012345
