apiVersion: observability.leorunners.io/v1
kind: AlertConfig
metadata:
  name: staging
  version: 1.0.0
spec:
  enabled: true
  namespace: LeoRunners/Controller
  dimensions: [provider, region, outcome]
  alerts:
    - name: disabled-cost-alert
      enabled: false
      metric: lifecycle_duration_seconds
      statistic: Average
      comparison: GreaterThanThreshold
      threshold: 30
      period_seconds: 60
      evaluation_periods: 1
      severity: info
      dimensions: [provider]
      actions: [none]
