# Runner validation workload. It runs only for pull requests from this
# repository into main: no push triggers, no secrets, no deployment, read-only
# token, nothing that outlives the run.
#
# Where it runs is a repository variable, so the same workflow can run on
# GitHub-hosted runners (the fallback) or on LeoRunners without a commit:
#   LEO_RUNS_ON = ["self-hosted","linux","x64","<your approved label>"]
# Unset, it uses ubuntu-latest.
#
# Optional repository variables:
#   LEO_CYPRESS_BROWSER  chrome (default) or electron
#   LEO_REQUIRE_DOCKER   "true" to require a working Docker daemon
name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"
  CI: "true"

jobs:
  lint:
    name: lint (actionlint, biome, custom)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LEO_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - name: Report runner environment
        run: scripts/report-environment.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check the Node version
        run: test "$(node --version)" = "v${NODE_VERSION}"
      - name: Ensure yarn
        run: command -v yarn >/dev/null || npm install --global yarn@1.22.22
      - name: Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: yarn install --frozen-lockfile
      - name: Install actionlint (checksum verified)
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) arch=amd64; sha=$ACTIONLINT_SHA256_LINUX_AMD64 ;;
            ARM64) arch=arm64; sha=$ACTIONLINT_SHA256_LINUX_ARM64 ;;
            *) echo "::error::unsupported runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          file="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color=false .github/workflows/*.yml'
      - name: Biome
        run: yarn lint
      - name: Custom lint
        run: yarn lint:custom

  unit:
    name: unit tests (shard ${{ matrix.shard }}/2)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LEO_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ensure yarn
        run: command -v yarn >/dev/null || npm install --global yarn@1.22.22
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: yarn install --frozen-lockfile
      - name: Run this shard
        run: yarn vitest run --shard=${{ matrix.shard }}/2

  build:
    name: build and upload artifact
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LEO_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ensure yarn
        run: command -v yarn >/dev/null || npm install --global yarn@1.22.22
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: The hidden manifest exists before upload
        run: test -s dist/.vite/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  integration:
    name: temporary environment, health check, cypress, teardown
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LEO_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - name: Report runner environment
        run: scripts/report-environment.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ensure yarn
        run: command -v yarn >/dev/null || npm install --global yarn@1.22.22
      - name: Cypress binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies (with the Cypress binary)
        run: yarn install --frozen-lockfile
      - name: Download the built application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: The hidden manifest survived the artifact round trip
        run: test -s dist/.vite/manifest.json
      - name: Docker capability
        if: vars.LEO_REQUIRE_DOCKER == 'true'
        run: |
          docker info --format '{{.ServerVersion}}'
          docker run --rm alpine:3.22 echo "docker works"
      - name: Install the legacy Terraform (checksum verified, linux/amd64 only)
        run: |
          set -euo pipefail
          if [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::Terraform ${TERRAFORM_VERSION} has no linux/${RUNNER_ARCH} build. This job needs an x64 runner."
            exit 1
          fi
          file="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/$file"
          echo "${TERRAFORM_SHA256_LINUX_AMD64}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/terraform-bin"
          unzip -o -q "$RUNNER_TEMP/$file" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"
      - name: Temporary environment up
        run: scripts/terraform-environment.sh up "run-${{ github.run_id }}-${{ github.run_attempt }}" "$RUNNER_TEMP/tf-env"
      - name: Serve the built application and wait for health
        run: |
          nohup yarn preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/preview.pid"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/health.json | grep -q '"status": *"ok"'; then echo healthy; exit 0; fi
            sleep 1
          done
          echo "::error::application did not become healthy"; cat "$RUNNER_TEMP/preview.log"; exit 1
      - name: Cypress
        env:
          CYPRESS_BROWSER: ${{ vars.LEO_CYPRESS_BROWSER || 'chrome' }}
        run: yarn cypress run --browser "$CYPRESS_BROWSER"
      - name: Stop the server
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/preview.pid" ]; then kill "$(cat "$RUNNER_TEMP/preview.pid")" 2>/dev/null || true; fi
      - name: Temporary environment down
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/tf-env/terraform.tfstate" ]; then
            scripts/terraform-environment.sh down "run-${{ github.run_id }}-${{ github.run_attempt }}" "$RUNNER_TEMP/tf-env"
          else
            echo "nothing to tear down"
          fi
