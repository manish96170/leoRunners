apiVersion: v1
kind: ConfigMap
metadata:
  name: leo-runners-controller
  labels:
    app.kubernetes.io/name: leo-runners-controller
data:
  LISTEN_ADDR: ":8080"
  STATE_PATH: /var/lib/leo-runners/state.json
  RECONCILE_INTERVAL: 30s
  RECONCILE_OPERATION_TIMEOUT: 30s
  RECONCILE_MAX_RECORDS: "1000"
  CAPACITY_PROVIDER: fake
  CAPACITY_MODE: fallback
  CAPACITY_POOL_ID: configured
  CAPACITY_OWNERSHIP: managed
  CAPACITY_POOL_PROVIDER: fake
  CAPACITY_SECURITY_PROFILE: isolated
  CAPACITY_MAX_RUNNERS: "100"
  AWS_REGION: us-east-1
  AWS_LAUNCH_TEMPLATE_ID: ""
  AWS_LAUNCH_TEMPLATE_NAME: ""
  AWS_LAUNCH_TEMPLATE_VERSION: ""
  AWS_SUBNET_ID: ""
  AWS_SECURITY_GROUP_IDS: ""
  AWS_INSTANCE_TYPE: ""
  AWS_RUNNER_INSTANCE_PROFILE_ARN: ""
  AWS_RUNNER_INSTANCE_PROFILE_NAME: ""
  GCP_PROJECT: ""
  GCP_ZONE: us-central1-a
  GCP_INSTANCE_TEMPLATE: ""
  GCP_NAME_PREFIX: leo-runner
  GITHUB_JIT_ENABLED: "false"
  GITHUB_RUNNER_GROUP_ID: "0"
  GITHUB_API_BASE_URL: https://api.github.com
  GITHUB_JIT_REQUEST_TIMEOUT: 30s
  GITHUB_REGISTRATION_TIMEOUT: 10m
  GITHUB_REGISTRATION_POLL_INTERVAL: 5s
  AI_ENABLED: "false"
  AI_PROVIDER: disabled
  AI_ENDPOINT: ""
  AI_MODEL: ""
  AI_REGION: ""
  AI_TIMEOUT: 5s
  AI_MAX_LOG_BYTES: "65536"
  AI_CONSENT_APPROVED: "false"
  EXTENSIONS_ENABLED: "false"
  EXTENSIONS_TENANT_ALLOWLIST: ""
  EXTENSIONS_QUEUE_SIZE: "32"
  EXTENSIONS_TIMEOUT: 2s
  EXTENSIONS_REPORT_BUFFER: "64"
