apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: leo-runners

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: leo-runners/controller
    newName: ghcr.io/example/leo-runners-controller
    digest: sha256:replace-with-real-digest
